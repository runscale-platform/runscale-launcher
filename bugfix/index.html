<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Баг Фикс для Бизнеса</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #0A0A0A;
      --surface: #2E2E2E;
      --surface-2: #383838;
      --sheet: #242424;
      --text: #F2F2F2;
      --text-secondary: #C4C4C4;
      --text-muted: #A8A8A8;
      --action: #2563EB;
      --action-ink: #FFFFFF;
      --action-text: #6AA5FF;
      --negative: #FF5C4D;
      --rim-glow: rgba(255, 255, 255, 0.22);
      --rim-shade: rgba(28, 27, 24, 0.10);
      --card-shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.9);
      --scrim: rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: min(430px, 100%);
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    }
    h1 {
      margin: 8px 0 0;
      text-align: center;
      font-size: clamp(32px, 8.4vw, 40px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .lead {
      margin: 10px 0 28px;
      text-align: center;
      color: var(--text-muted);
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
    }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .plaque {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 76px;
      padding: 14px 14px 14px 18px;
      border: 0;
      border-radius: 16px;
      background: var(--hue);
      color: var(--ink);
      font: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 var(--rim-glow),
        inset 0 -1px 0 var(--rim-shade),
        var(--card-shadow);
      -webkit-tap-highlight-color: transparent;
    }
    .plaque::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(150deg, var(--rim-glow) 0%, rgba(255, 255, 255, 0) 45%, var(--rim-shade) 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .plaque:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    .plaque b {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .glyphs { display: flex; align-items: center; gap: 6px; flex: none; color: var(--ink); }
    .glyphs svg { width: 32px; height: 32px; display: block; overflow: visible; }
    .stage { margin: 40px 4px 16px; color: var(--ink, var(--text)); }
    .stage svg { width: 100%; height: auto; display: block; overflow: visible; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .modal[hidden] { display: none; }
    .scrim { position: absolute; inset: 0; background: var(--scrim); }
    .panel {
      position: relative;
      width: 100%;
      max-height: 92dvh;
      overflow: auto;
      background: var(--hue, var(--sheet));
      color: var(--ink, var(--text));
      border-radius: 20px 20px 0 0;
      padding: 22px 20px max(20px, env(safe-area-inset-bottom));
    }
    .x {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: color-mix(in srgb, var(--ink, var(--text)) 14%, transparent);
      color: var(--ink, var(--text));
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .x svg { width: 22px; height: 22px; }
    .x:focus-visible, .btn:focus-visible { outline: 2px solid currentColor; outline-offset: 2px; }
    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .acts { display: flex; flex-direction: column; gap: 8px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-copy {
      background: var(--ink);
      color: var(--hue);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 0 rgba(0, 0, 0, 0.28);
    }
    .btn-dl {
      background: color-mix(in srgb, var(--ink) 14%, transparent);
      color: var(--ink);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 0 rgba(0, 0, 0, 0.12);
    }
    .md {
      border-radius: 4px;
      padding: 2px 6px;
      background: var(--ink);
      color: var(--hue);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      line-height: 1.3;
    }
    .acts[hidden] { display: none; }
    .note {
      min-height: 0;
      margin: 8px 0 0;
      text-align: center;
      font-size: 13px;
      color: var(--negative);
    }
    .note:empty { display: none; }
    @media (min-width: 760px) {
      .modal { align-items: center; padding: 24px; }
      .panel { max-width: 430px; border-radius: 20px; padding: 28px 24px 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Баг Фикс<br>для Бизнеса</h1>
    <p class="lead">забрать чит-код</p>
    <div class="stack" id="stack"></div>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="scrim" data-close></div>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="reel-title">
      <button type="button" class="x" id="close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="stage" id="stage"></div>
      <h2 id="reel-title" class="sr"></h2>
      <div class="acts">
        <button type="button" class="btn btn-copy" id="copy">Скопировать</button>
        <button type="button" class="btn btn-dl" id="download"><span class="lbl">Скачать</span><span class="md">MD</span></button>
      </div>
      <p class="note" id="note"></p>
    </section>
  </div>

  <script>
    const N = 17
    const STEP = 3
    const R = 1
    const STILL = window.matchMedia('(prefers-reduced-motion: reduce)').matches
    const LETTERS = {
      'А': ['111', '101', '111', '101', '101'],
      'Б': ['1111', '1000', '1111', '1001', '1111'],
      'В': ['110', '101', '110', '101', '110'],
      'Д': ['0111', '0101', '0101', '0101', '1111'],
      'Е': ['111', '100', '110', '100', '111'],
      'И': ['1001', '1001', '1011', '1101', '1001'],
      'К': ['1001', '1010', '1100', '1010', '1001'],
      'Л': ['0111', '0101', '0101', '0101', '1101'],
      'Н': ['1001', '1001', '1111', '1001', '1001'],
      'О': ['111', '101', '101', '101', '111'],
      'Р': ['111', '101', '111', '100', '100'],
      'С': ['111', '100', '100', '100', '111'],
      'Ф': ['00100', '11111', '10101', '11111', '00100'],
      'Ш': ['10101', '10101', '10101', '10101', '11111'],
      'Э': ['111', '001', '011', '001', '111'],
      'Ы': ['10001', '10001', '11101', '10101', '11101'],
    }

    const ICONS = {
      chart: [[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[1,8],[1,9],[1,10],[1,11],[1,12],[1,13],[1,14],[2,14],[3,11],[3,12],[3,13],[3,14],[4,11],[4,12],[4,13],[4,14],[5,14],[6,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],[7,8],[7,9],[7,10],[7,11],[7,12],[7,13],[7,14],[8,14],[9,5],[9,6],[9,7],[9,8],[9,9],[9,10],[9,11],[9,12],[9,13],[9,14],[10,5],[10,6],[10,7],[10,8],[10,9],[10,10],[10,11],[10,12],[10,13],[10,14],[11,14],[12,2],[12,3],[12,4],[12,5],[12,6],[12,7],[12,8],[12,9],[12,10],[12,11],[12,12],[12,13],[12,14],[13,2],[13,3],[13,4],[13,5],[13,6],[13,7],[13,8],[13,9],[13,10],[13,11],[13,12],[13,13],[13,14],[14,14],[15,14]],
      person: [[4,10],[4,11],[4,12],[4,13],[4,14],[5,9],[5,14],[6,3],[6,4],[6,5],[6,8],[6,9],[6,14],[7,2],[7,6],[7,14],[8,2],[8,6],[8,14],[9,2],[9,6],[9,14],[10,3],[10,4],[10,5],[10,8],[10,9],[10,14],[11,9],[11,14],[12,10],[12,11],[12,12],[12,13],[12,14]],
      answers: [[3,4],[3,5],[3,8],[3,9],[3,12],[3,13],[4,4],[4,5],[4,8],[4,9],[4,12],[4,13],[7,4],[7,5],[7,8],[7,9],[7,12],[7,13],[8,4],[8,5],[8,8],[8,9],[8,12],[8,13],[9,4],[9,5],[9,8],[9,9],[9,12],[9,13],[10,4],[10,5],[10,8],[10,9],[10,12],[10,13],[11,4],[11,5],[11,8],[11,9],[11,12],[11,13],[12,4],[12,5],[12,8],[12,9],[12,12],[12,13],[13,4],[13,5],[13,8],[13,9],[13,12],[13,13]]
    }

    const SERIES = [
      {
        id: 'dashboards',
        name: 'Дашборды',
        word: 'ДАШБОРДЫ',
        hue: '#FFD60A',
        ink: '#1a1a1a',
        file: 'дашборды.md',
        icons: ['chart', 'person', 'answers'],
        md: [
          '# Дашборды не стратегия',
          '',
          'У каждого графика назвать решение, ради которого его собрали.',
          '',
          'Назвать человека и как часто он принимает решение на базе метрики.',
          '',
          'Три ответа: что сделать сегодня, кто отвечает и как часто.',
          '',
          'Сначала решение, потом данные, потом технология.',
          '',
        ].join('\n'),
      },
      {
        id: 'kassa',
        name: 'Касса',
        word: 'КАССА',
        hue: '#FF0080',
        ink: '#ffffff',
        icons: ['chart', 'person', 'answers'],
      },
      {
        id: 'sklad',
        name: 'Склад',
        word: 'СКЛАД',
        hue: '#C5F946',
        ink: '#1a1a1a',
        icons: ['chart', 'person', 'answers'],
      },
    ]

    function rng(seed) {
      let s = seed >>> 0
      return function () {
        s = (Math.imul(1664525, s) + 1013904223) >>> 0
        return s / 4294967296
      }
    }
    function shuffle(list, seed) {
      const a = list.slice()
      const rand = rng(seed)
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1))
        const t = a[i]
        a[i] = a[j]
        a[j] = t
      }
      return a
    }

    const NS = 'http://www.w3.org/2000/svg'
    const SIZE = (N - 1) * STEP + 2 * R
    const GAP = 2
    const PAUSE = 2000
    const BUILD = 640
    const PERIOD = PAUSE + BUILD
    const ALGOS = 12
    const plays = []
    const CLAIM = new Map()
    const USED = new Set()

    function hash(str) {
      let h = 2166136261
      for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619)
      return h >>> 0
    }

    function claim(key) {
      if (CLAIM.has(key)) return CLAIM.get(key)
      let algo = hash(key) % ALGOS
      let n = 0
      while (USED.has(algo) && n < ALGOS) {
        algo = (algo + 1) % ALGOS
        n++
      }
      USED.add(algo)
      const rec = { algo: algo, offset: hash(key + ':o') % PERIOD }
      CLAIM.set(key, rec)
      return rec
    }

    function orderOf(algo, cells, cycle, key) {
      const cx = 8
      const cy = 8
      const dist = function (p) { return (p[0] - cx) * (p[0] - cx) + (p[1] - cy) * (p[1] - cy) }
      let list
      if (algo === 0) list = cells.slice().sort(function (a, b) { return a[1] - b[1] || a[0] - b[0] })
      else if (algo === 1) list = cells.slice().sort(function (a, b) { return a[1] - b[1] || b[0] - a[0] })
      else if (algo === 2) list = cells.slice().sort(function (a, b) { return a[0] - b[0] || a[1] - b[1] })
      else if (algo === 3) list = cells.slice().sort(function (a, b) { return b[0] - a[0] || b[1] - a[1] })
      else if (algo === 4) list = cells.slice().sort(function (a, b) { return (a[0] + a[1]) - (b[0] + b[1]) || a[0] - b[0] })
      else if (algo === 5) list = cells.slice().sort(function (a, b) { return (b[0] + b[1]) - (a[0] + a[1]) || b[1] - a[1] })
      else if (algo === 6) list = cells.slice().sort(function (a, b) { return dist(a) - dist(b) || a[0] - b[0] })
      else if (algo === 7) list = cells.slice().sort(function (a, b) { return dist(b) - dist(a) || b[0] - a[0] })
      else if (algo === 8) list = cells.slice().sort(function (a, b) { return Math.atan2(a[1] - cy, a[0] - cx) - Math.atan2(b[1] - cy, b[0] - cx) })
      else if (algo === 9) list = cells.slice().sort(function (a, b) { return Math.atan2(b[1] - cy, b[0] - cx) - Math.atan2(a[1] - cy, a[0] - cx) })
      else if (algo === 10) list = cells.slice().sort(function (a, b) { return (a[0] ^ a[1]) - (b[0] ^ b[1]) || a[1] - b[1] })
      else list = shuffle(cells, hash(key + ':' + cycle))
      const salt = cycle * 17 + (hash(key) % 97)
      const shift = list.length ? salt % list.length : 0
      const cut = list.slice(shift).concat(list.slice(0, shift))
      if (salt % 2) cut.reverse()
      return cut
    }

    function circleAt(gx, gy) {
      const c = document.createElementNS(NS, 'circle')
      c.setAttribute('cx', gx * STEP + R)
      c.setAttribute('cy', gy * STEP + R)
      c.setAttribute('r', R)
      c.setAttribute('fill', 'transparent')
      return c
    }

    function actorOf(key, cells, dots) {
      return { key: key, cells: cells, dots: dots, cycle: -1, rank: {} }
    }

    function mountPlaque(host, item) {
      host.replaceChildren()
      const actors = item.icons.map(function (name, i) {
        const cells = ICONS[name]
        const svg = document.createElementNS(NS, 'svg')
        svg.setAttribute('viewBox', '0 0 ' + SIZE + ' ' + SIZE)
        svg.setAttribute('width', SIZE)
        svg.setAttribute('height', SIZE)
        svg.setAttribute('aria-hidden', 'true')
        const dots = cells.map(function (p) {
          const c = circleAt(p[0], p[1])
          svg.appendChild(c)
          return { el: c, at: p[0] + ',' + p[1] }
        })
        host.appendChild(svg)
        return actorOf(item.id + ':' + name + ':' + i, cells, dots)
      })
      const play = { actors: actors }
      plays.push(play)
      return play
    }

    function paint(play, now) {
      play.actors.forEach(function (actor) {
        const rec = claim(actor.key)
        const shifted = now + rec.offset
        const cycle = Math.floor(shifted / PERIOD)
        const local = shifted - cycle * PERIOD
        if (actor.cycle !== cycle) {
          const order = orderOf(rec.algo, actor.cells, cycle, actor.key)
          actor.rank = {}
          order.forEach(function (p, i) { actor.rank[p[0] + ',' + p[1]] = i })
          actor.cycle = cycle
        }
        const total = actor.cells.length
        let n = total
        if (!STILL && local >= PAUSE) n = Math.round(total * (local - PAUSE) / BUILD)
        actor.dots.forEach(function (d) {
          d.el.setAttribute('fill', actor.rank[d.at] < n ? 'currentColor' : 'transparent')
        })
      })
    }

    function tick(now) {
      plays.forEach(function (play) { paint(play, now) })
      if (!STILL) requestAnimationFrame(tick)
    }
    requestAnimationFrame(tick)

    const stack = document.getElementById('stack')
    const modal = document.getElementById('modal')
    const stage = document.getElementById('stage')
    const panel = document.querySelector('.panel')
    const acts = document.querySelector('.acts')
    const note = document.getElementById('note')
    const copyBtn = document.getElementById('copy')
    const downloadBtn = document.getElementById('download')
    const downloadLabel = downloadBtn.querySelector('.lbl')
    let current = null
    let modalPlay = null
    let copyTimer = 0
    let downloadTimer = 0

    SERIES.forEach(function (item) {
      const button = document.createElement('button')
      button.type = 'button'
      button.className = 'plaque'
      button.dataset.id = item.id
      button.style.setProperty('--hue', item.hue)
      button.style.setProperty('--ink', item.ink)
      const name = document.createElement('b')
      name.textContent = item.name
      const icons = document.createElement('span')
      icons.className = 'glyphs'
      mountPlaque(icons, item)
      button.append(name, icons)
      button.addEventListener('click', function () { open(item) })
      stack.appendChild(button)
    })

    function wordCells(text) {
      const cells = []
      let x = 0
      for (const ch of text) {
        const rows = LETTERS[ch]
        if (!rows) continue
        const width = Math.max.apply(null, rows.map(function (row) { return row.length }))
        rows.forEach(function (row, y) {
          for (let c = 0; c < row.length; c++) if (row[c] === '1') cells.push([x + c, y])
        })
        x += width + 1
      }
      return { cells: cells, cols: Math.max(1, x - 1), rows: 5 }
    }

    function mountStage(host, item) {
      host.replaceChildren()
      const gap = GAP
      const row = item.icons.length * N + Math.max(0, item.icons.length - 1) * gap
      const word = wordCells(item.word)
      const ox = Math.max(0, Math.round((row - word.cols) / 2))
      const oy = N + gap
      const cols = Math.max(row, ox + word.cols)
      const rows = oy + word.rows
      const w = (cols - 1) * STEP + 2 * R
      const h = (rows - 1) * STEP + 2 * R
      const svg = document.createElementNS(NS, 'svg')
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h)
      svg.setAttribute('aria-hidden', 'true')
      const actors = item.icons.map(function (name, i) {
        const cells = ICONS[name]
        const x0 = i * (N + gap)
        const dots = cells.map(function (p) {
          const c = circleAt(x0 + p[0], p[1])
          svg.appendChild(c)
          return { el: c, at: p[0] + ',' + p[1] }
        })
        return actorOf(item.id + ':' + name + ':' + i, cells, dots)
      })
      word.cells.forEach(function (p) {
        const c = circleAt(ox + p[0], oy + p[1])
        c.setAttribute('fill', 'currentColor')
        svg.appendChild(c)
      })
      host.appendChild(svg)
      const play = { actors: actors }
      plays.push(play)
      return play
    }

    function open(item) {
      current = item
      if (modalPlay) {
        const at = plays.indexOf(modalPlay)
        if (at >= 0) plays.splice(at, 1)
      }
      modalPlay = mountStage(stage, item)
      document.getElementById('reel-title').textContent = item.name
      panel.style.setProperty('--hue', item.hue)
      panel.style.setProperty('--ink', item.ink)
      acts.hidden = !item.md
      note.textContent = ''
      copyBtn.textContent = 'Скопировать'
      downloadLabel.textContent = 'Скачать'
      modal.hidden = false
      document.body.style.overflow = 'hidden'
      document.getElementById('close').focus()
    }

    function close() {
      modal.hidden = true
      document.body.style.overflow = ''
      const back = stack.querySelector('[data-id="' + (current && current.id) + '"]')
      if (back) back.focus()
    }

    function copyBySelect(text) {
      const area = document.createElement('textarea')
      area.value = text
      area.setAttribute('readonly', '')
      area.style.position = 'fixed'
      area.style.top = '0'
      area.style.left = '0'
      area.style.opacity = '0'
      document.body.appendChild(area)
      area.focus()
      area.select()
      let ok = false
      try { ok = document.execCommand('copy') } catch { ok = false }
      area.remove()
      return ok
    }

    async function copyText() {
      if (!current || !current.md) return
      note.textContent = ''
      let ok = false
      try {
        await navigator.clipboard.writeText(current.md)
        ok = true
      } catch { ok = false }
      if (!ok) ok = copyBySelect(current.md)
      if (!ok) {
        note.textContent = 'Браузер не дал скопировать. Скачайте файл.'
        return
      }
      copyBtn.textContent = 'Скопировано'
      clearTimeout(copyTimer)
      copyTimer = setTimeout(function () { copyBtn.textContent = 'Скопировать' }, 1600)
    }

    function downloadFile() {
      if (!current || !current.md) return
      const blob = new Blob([current.md], { type: 'text/markdown;charset=utf-8' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = current.file
      document.body.appendChild(a)
      a.click()
      a.remove()
      URL.revokeObjectURL(url)
      downloadLabel.textContent = 'Готово'
      clearTimeout(downloadTimer)
      downloadTimer = setTimeout(function () { downloadLabel.textContent = 'Скачать' }, 1600)
    }

    copyBtn.addEventListener('click', copyText)
    downloadBtn.addEventListener('click', downloadFile)
    modal.addEventListener('click', function (event) {
      if (event.target.closest('[data-close], #close')) close()
    })
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !modal.hidden) close()
    })
  </script>
</body>
</html>
