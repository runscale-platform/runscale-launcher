<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Баг Фикс для Бизнеса</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    :root {
      --bg: #0A0A0A;
      --surface: #2E2E2E;
      --surface-2: #383838;
      --sheet: #242424;
      --text: #F2F2F2;
      --text-secondary: #C4C4C4;
      --text-muted: #A8A8A8;
      --action: #2563EB;
      --action-ink: #FFFFFF;
      --action-text: #6AA5FF;
      --negative: #FF5C4D;
      --rim-glow: rgba(255, 255, 255, 0.22);
      --rim-shade: rgba(28, 27, 24, 0.10);
      --card-shadow: 0 24px 48px -24px rgba(0, 0, 0, 0.9);
      --scrim: rgba(0, 0, 0, 0.6);
      --ink: #F2F2F2;
      --dim: #96B2EF;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
      font-size: 17px;
      -webkit-font-smoothing: antialiased;
    }
    .page {
      width: min(430px, 100%);
      margin: 0 auto;
      padding: max(28px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
    }
    h1 {
      margin: 8px 0 0;
      text-align: center;
      font-size: clamp(32px, 8.4vw, 40px);
      font-weight: 800;
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .lead {
      margin: 10px 0 28px;
      text-align: center;
      color: var(--text-muted);
      font-size: 17px;
      font-weight: 600;
      line-height: 1.3;
    }
    .stack { display: flex; flex-direction: column; gap: 10px; }
    .plaque {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      min-height: 76px;
      padding: 14px 14px 14px 18px;
      border: 0;
      border-radius: 16px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
      box-shadow:
        inset 0 1px 0 var(--rim-glow),
        inset 0 -1px 0 var(--rim-shade),
        var(--card-shadow);
      -webkit-tap-highlight-color: transparent;
    }
    .plaque::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(150deg, var(--rim-glow) 0%, rgba(255, 255, 255, 0) 45%, var(--rim-shade) 100%);
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
    .plaque:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
    .plaque b {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .glyphs { display: flex; align-items: center; gap: 8px; flex: none; }
    .glyphs svg, .modal-glyphs svg { display: block; overflow: visible; }
    .modal {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .modal[hidden] { display: none; }
    .scrim { position: absolute; inset: 0; background: var(--scrim); }
    .panel {
      position: relative;
      width: 100%;
      max-height: 92dvh;
      overflow: auto;
      background: var(--sheet);
      color: var(--text);
      border-radius: 20px 20px 0 0;
      padding: 22px 20px max(20px, env(safe-area-inset-bottom));
    }
    .x {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 44px;
      height: 44px;
      border: 0;
      border-radius: 12px;
      background: var(--surface-2);
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .x svg { width: 22px; height: 22px; }
    .x:focus-visible, .btn:focus-visible { outline: 2px solid var(--action); outline-offset: 2px; }
    .modal-glyphs {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin: 52px 8px 22px;
    }
    .modal-glyphs svg { width: 76px; height: 76px; }
    .panel h2 {
      margin: 0 8px 22px;
      text-align: center;
      font-size: clamp(26px, 7vw, 32px);
      font-weight: 800;
      line-height: 1.12;
      letter-spacing: -0.03em;
      color: var(--text);
    }
    .acts { display: flex; flex-direction: column; gap: 8px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 16px;
      font: inherit;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .btn-copy {
      background: var(--action);
      color: var(--action-ink);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), inset 0 -1px 0 rgba(0, 0, 0, 0.28);
    }
    .btn-dl {
      background: var(--surface-2);
      color: var(--text);
      box-shadow: inset 0 1px 0 var(--rim-glow), inset 0 -1px 0 var(--rim-shade);
    }
    .md {
      border-radius: 4px;
      padding: 2px 6px;
      background: var(--text);
      color: var(--surface-2);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.04em;
      line-height: 1.3;
    }
    .note {
      min-height: 0;
      margin: 8px 0 0;
      text-align: center;
      font-size: 13px;
      color: var(--negative);
    }
    .note:empty { display: none; }
    @media (min-width: 760px) {
      .modal { align-items: center; padding: 24px; }
      .panel { max-width: 430px; border-radius: 20px; padding: 28px 24px 24px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <h1>Баг Фикс<br>для Бизнеса</h1>
    <p class="lead">забрать чит-код</p>
    <div class="stack" id="stack"></div>
  </main>

  <div class="modal" id="modal" hidden>
    <div class="scrim" data-close></div>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="reel-title">
      <button type="button" class="x" id="close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="modal-glyphs" id="modal-glyphs"></div>
      <h2 id="reel-title"></h2>
      <div class="acts">
        <button type="button" class="btn btn-copy" id="copy">Скопировать</button>
        <button type="button" class="btn btn-dl" id="download"><span class="lbl">Скачать</span><span class="md">MD</span></button>
      </div>
      <p class="note" id="note"></p>
    </section>
  </div>

  <script>
    const N = 17
    const STEP = 3
    const R = 1
    const AP = 533
    const INK = '#F2F2F2'
    const DIM = '#96B2EF'
    const STILL = window.matchMedia('(prefers-reduced-motion: reduce)').matches

    const ICONS = {
      chart: [[1,2],[1,3],[1,4],[1,5],[1,6],[1,7],[1,8],[1,9],[1,10],[1,11],[1,12],[1,13],[1,14],[2,14],[3,11],[3,12],[3,13],[3,14],[4,11],[4,12],[4,13],[4,14],[5,14],[6,8],[6,9],[6,10],[6,11],[6,12],[6,13],[6,14],[7,8],[7,9],[7,10],[7,11],[7,12],[7,13],[7,14],[8,14],[9,5],[9,6],[9,7],[9,8],[9,9],[9,10],[9,11],[9,12],[9,13],[9,14],[10,5],[10,6],[10,7],[10,8],[10,9],[10,10],[10,11],[10,12],[10,13],[10,14],[11,14],[12,2],[12,3],[12,4],[12,5],[12,6],[12,7],[12,8],[12,9],[12,10],[12,11],[12,12],[12,13],[12,14],[13,2],[13,3],[13,4],[13,5],[13,6],[13,7],[13,8],[13,9],[13,10],[13,11],[13,12],[13,13],[13,14],[14,14],[15,14]],
      person: [[4,10],[4,11],[4,12],[4,13],[4,14],[5,9],[5,14],[6,3],[6,4],[6,5],[6,8],[6,9],[6,14],[7,2],[7,6],[7,14],[8,2],[8,6],[8,14],[9,2],[9,6],[9,14],[10,3],[10,4],[10,5],[10,8],[10,9],[10,14],[11,9],[11,14],[12,10],[12,11],[12,12],[12,13],[12,14]],
      answers: [[3,4],[3,5],[3,8],[3,9],[3,12],[3,13],[4,4],[4,5],[4,8],[4,9],[4,12],[4,13],[7,4],[7,5],[7,8],[7,9],[7,12],[7,13],[8,4],[8,5],[8,8],[8,9],[8,12],[8,13],[9,4],[9,5],[9,8],[9,9],[9,12],[9,13],[10,4],[10,5],[10,8],[10,9],[10,12],[10,13],[11,4],[11,5],[11,8],[11,9],[11,12],[11,13],[12,4],[12,5],[12,8],[12,9],[12,12],[12,13],[13,4],[13,5],[13,8],[13,9],[13,12],[13,13]]
    }

    const SERIES = [
      {
        id: 'dashboards',
        name: 'Дашборды',
        reel: 'Дашборды не стратегия',
        file: 'дашборды.md',
        icons: ['chart', 'person', 'answers'],
        md: [
          '# Дашборды не стратегия',
          '',
          'У каждого графика назвать решение, ради которого его собрали.',
          '',
          'Назвать человека и как часто он принимает решение на базе метрики.',
          '',
          'Три ответа: что сделать сегодня, кто отвечает и как часто.',
          '',
          'Сначала решение, потом данные, потом технология.',
          '',
        ].join('\n'),
      },
    ]

    function rng(seed) {
      let s = seed >>> 0
      return function () {
        s = (Math.imul(1664525, s) + 1013904223) >>> 0
        return s / 4294967296
      }
    }
    function shuffle(list, seed) {
      const a = list.slice()
      const rand = rng(seed)
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1))
        const t = a[i]
        a[i] = a[j]
        a[j] = t
      }
      return a
    }

    const NS = 'http://www.w3.org/2000/svg'
    const SIZE = (N - 1) * STEP + 2 * R
    const plays = []
    let looping = false

    function circle(x, y) {
      const c = document.createElementNS(NS, 'circle')
      c.setAttribute('cx', x * STEP + R)
      c.setAttribute('cy', y * STEP + R)
      c.setAttribute('r', R)
      c.setAttribute('fill', 'transparent')
      return c
    }

    function mountIcons(host, names, seed) {
      host.replaceChildren()
      const icons = names.map(function (name, i) {
        const order = shuffle(ICONS[name], seed + i * 97)
        const svg = document.createElementNS(NS, 'svg')
        svg.setAttribute('viewBox', '0 0 ' + SIZE + ' ' + SIZE)
        svg.setAttribute('width', SIZE)
        svg.setAttribute('height', SIZE)
        svg.setAttribute('aria-hidden', 'true')
        const ink = order.map(function (p) {
          const c = circle(p[0], p[1])
          svg.appendChild(c)
          return c
        })
        const spark = []
        for (let k = 0; k < 5; k++) {
          const c = circle(0, 0)
          svg.appendChild(c)
          spark.push(c)
        }
        host.appendChild(svg)
        const have = {}
        order.forEach(function (p) { have[p[0] + ',' + p[1]] = true })
        const rest = []
        for (let y = 0; y < N; y++) {
          for (let x = 0; x < N; x++) {
            if (!have[x + ',' + y]) rest.push([x, y])
          }
        }
        return { order: order, ink: ink, spark: spark, rest: rest }
      })
      const play = { icons: icons, t0: performance.now() }
      plays.push(play)
      paint(play, STILL ? AP * 4 : 0)
      return play
    }

    function paint(play, elapsed) {
      play.icons.forEach(function (icon, i) {
        const local = elapsed - i * AP
        const n = STILL ? icon.order.length : Math.max(0, Math.min(icon.order.length, Math.round(icon.order.length * local / AP)))
        icon.ink.forEach(function (el, k) {
          el.setAttribute('fill', k < n ? INK : 'transparent')
        })
        const live = !STILL && n > 0 && n < icon.order.length
        icon.spark.forEach(function (el, k) {
          if (!live) {
            el.setAttribute('fill', 'transparent')
            return
          }
          const bag = shuffle(icon.rest.concat(icon.order.slice(n)), (Math.floor(elapsed / 66) + i * 19 + k) >>> 0)
          const p = bag[k]
          el.setAttribute('cx', p[0] * STEP + R)
          el.setAttribute('cy', p[1] * STEP + R)
          el.setAttribute('fill', DIM)
        })
      })
    }

    function tick(now) {
      let run = false
      plays.forEach(function (play) {
        const elapsed = now - play.t0
        paint(play, elapsed)
        if (elapsed < AP * 3 + 40) run = true
      })
      if (run) requestAnimationFrame(tick)
      else looping = false
    }
    function ensure() {
      if (STILL || looping) return
      looping = true
      requestAnimationFrame(tick)
    }
    ensure()

    const stack = document.getElementById('stack')
    const modal = document.getElementById('modal')
    const modalGlyphs = document.getElementById('modal-glyphs')
    const title = document.getElementById('reel-title')
    const note = document.getElementById('note')
    const copyBtn = document.getElementById('copy')
    const downloadBtn = document.getElementById('download')
    const downloadLabel = downloadBtn.querySelector('.lbl')
    let current = null
    let modalPlay = null
    let copyTimer = 0
    let downloadTimer = 0

    SERIES.forEach(function (item) {
      const button = document.createElement('button')
      button.type = 'button'
      button.className = 'plaque'
      button.dataset.id = item.id
      const name = document.createElement('b')
      name.textContent = item.name
      const icons = document.createElement('span')
      icons.className = 'glyphs'
      mountIcons(icons, item.icons, 20261120)
      button.append(name, icons)
      button.addEventListener('click', function () { open(item) })
      stack.appendChild(button)
    })

    function open(item) {
      current = item
      if (modalPlay) {
        const at = plays.indexOf(modalPlay)
        if (at >= 0) plays.splice(at, 1)
      }
      modalPlay = mountIcons(modalGlyphs, item.icons, 20261120)
      modalPlay.t0 = performance.now()
      ensure()
      title.textContent = item.reel
      note.textContent = ''
      copyBtn.textContent = 'Скопировать'
      downloadLabel.textContent = 'Скачать'
      modal.hidden = false
      document.body.style.overflow = 'hidden'
      document.getElementById('close').focus()
    }

    function close() {
      modal.hidden = true
      document.body.style.overflow = ''
      const back = stack.querySelector('[data-id="' + (current && current.id) + '"]')
      if (back) back.focus()
    }

    function copyBySelect(text) {
      const area = document.createElement('textarea')
      area.value = text
      area.setAttribute('readonly', '')
      area.style.position = 'fixed'
      area.style.top = '0'
      area.style.left = '0'
      area.style.opacity = '0'
      document.body.appendChild(area)
      area.focus()
      area.select()
      let ok = false
      try { ok = document.execCommand('copy') } catch { ok = false }
      area.remove()
      return ok
    }

    async function copyText() {
      if (!current) return
      note.textContent = ''
      let ok = false
      try {
        await navigator.clipboard.writeText(current.md)
        ok = true
      } catch { ok = false }
      if (!ok) ok = copyBySelect(current.md)
      if (!ok) {
        note.textContent = 'Браузер не дал скопировать. Скачайте файл.'
        return
      }
      copyBtn.textContent = 'Скопировано'
      clearTimeout(copyTimer)
      copyTimer = setTimeout(function () { copyBtn.textContent = 'Скопировать' }, 1600)
    }

    function downloadFile() {
      if (!current) return
      const blob = new Blob([current.md], { type: 'text/markdown;charset=utf-8' })
      const url = URL.createObjectURL(blob)
      const a = document.createElement('a')
      a.href = url
      a.download = current.file
      document.body.appendChild(a)
      a.click()
      a.remove()
      URL.revokeObjectURL(url)
      downloadLabel.textContent = 'Готово'
      clearTimeout(downloadTimer)
      downloadTimer = setTimeout(function () { downloadLabel.textContent = 'Скачать' }, 1600)
    }

    copyBtn.addEventListener('click', copyText)
    downloadBtn.addEventListener('click', downloadFile)
    modal.addEventListener('click', function (event) {
      if (event.target.closest('[data-close], #close')) close()
    })
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && !modal.hidden) close()
    })
  </script>
</body>
</html>
